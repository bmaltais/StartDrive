name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y shellcheck jq
      # `omarchy plugin validate` needs Omarchy, which this runner doesn't
      # have; tests/manifest.test.js repeats its checks and the pre-commit
      # hook runs the real validator.
      - run: npm test
      - run: scripts/lint-sh.sh
