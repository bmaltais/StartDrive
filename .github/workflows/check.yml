name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y shellcheck jq
      # The QML and manifest checks in scripts/check.sh need Qt and Omarchy, which this runner does not have;
      # they run in the pre-commit hook. tests/manifest.test.js repeats the marketplace's rules for CI.
      - run: scripts/lint-sh.sh
      - run: scripts/lint-rules.sh
      - run: tests/cli.sh
      - run: npm test
