# shellcheck shell=bash
# StartDrive's settings for the devkit (scripts/devkit, a submodule; docs/testing.md): the test session, the tours and the recorder.
TOUR_PLUGIN_ID=io.github.bmaltais.startdrive
DEVKIT_NAME=startdrive
DEVKIT_LAYERS=(omarchy-startdrive)
DEVKIT_ENV=(STARTDRIVE_DEMO=1)            # the CLI serves fixture drives (lib/demo.sh) and runs no systemd, rclone or keyring command
TOUR_SANDBOX_COPY=()                      # nothing of the real config is copied in
TOUR_SANDBOX_LINK=(.local/share/icons)
# The recorder proves a tour touched none of these. It lists them recursively, so never name ~/Cloud or anything a mount lives under:
# walking a live cloud mount is slow and spends the drive's API quota.
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startdrive .config/systemd/user .config/rclone .local/share/applications/startdrive.desktop .local/bin/startdrive)

# A click in the session must not mount, remove or write a real account: the sandbox is put in demo mode (a marker file in its own
# home; the session refuses to start without it) and the first-run offer is answered.
devkit_sandbox() {
  local h=$1
  mkdir -p "$h/.config/startdrive/demo"; : >"$h/.config/startdrive/demo/ENABLED"
  [[ -f $h/.config/startdrive/demo/ENABLED ]] || { echo "the sandbox could not be put in demo mode" >&2; return 1; }
  printf 'SETUP_DONE=1\n' >"$h/.config/startdrive/config"
}

DEVKIT_USAGE='  dev open | setup | settings DRIVE_ID | close   open a window of the plugin there, or close it'
dev_cmd_open() { nenv omarchy-shell -q "$ID" close 2>/dev/null || true; sleep 0.4; dev_window open "$ID" open; }
dev_cmd_setup() { dev_window setup "$ID" setup; }
dev_cmd_settings() { dev_window settings "$ID" settings "${1:?settings needs a drive id}"; }
dev_cmd_close() { nenv omarchy-shell "$ID" close >/dev/null; echo "dev close: closed"; }

# `reload` (the kit's, via scripts/reload): the service answers `state` once it is loaded, and a window is opened after that.
DEVKIT_RELOAD_READY=state
reload_open() {
  case $1 in
    open) omarchy-shell -q "$ID" close || true; sleep 0.4; omarchy-shell "$ID" open >/dev/null ;;
    setup) omarchy-shell "$ID" setup >/dev/null ;;
    settings) [[ -n ${2:-} ]] || die "settings needs a drive id"; omarchy-shell "$ID" settings "$2" >/dev/null ;;
    *) die "unknown window $1 (open | setup | settings DRIVE_ID)" ;;
  esac
}

# `check` (scripts/check.sh) runs these after its own steps.
# Icons in QML are private-use glyphs, and writing a file through a tool that drops them leaves an empty string where the
# icon was (it happened twice). An empty icon is never intended, so an empty `iconText` fails.
icons() {
  local hits
  hits=$(grep -nE 'iconText: *""' ./*.qml || true)
  [[ -z $hits ]] || { echo "empty iconText (an icon lost its glyph; write icons as \\uXXXX escapes):"; echo "$hits"; return 1; }
}
# A recording fingerprints TOUR_REAL_UNCHANGED by walking it, and walking a live cloud mount is slow and spends the drive's API quota,
# so no tour (nor this file) may name one. The kit's lint does not know this; it is StartDrive's own.
cloud_mounts() {
  local hits
  hits=$(grep -nE '^TOUR_REAL_UNCHANGED=.*(^|[ (/])Cloud([ )/]|$)' scripts/tours/*.sh devkit.conf 2>/dev/null || true)
  [[ -z $hits ]] || { echo "TOUR_REAL_UNCHANGED names a cloud mount (it is walked, which is slow and spends the drive's quota):"; printf '    %s\n' "${hits//$'\n'/$'\n    '}"; return 1; }
}
devkit_check() {
  step "tours name no cloud mount (TOUR_REAL_UNCHANGED)" cloud_mounts
  step "CLI behaviour (tests/cli.sh)" tests/cli.sh
  step "model, CLI input checks, marketplace rules (node --test)" node --test
  step "QML icons (no empty iconText)" icons
}
