# shellcheck shell=bash
# StartDrive's settings for the devkit (scripts/devkit; docs/testing.md): the test session, the tours and the recorder.
TOUR_TITLE=StartDrive
TOUR_PLUGIN_ID=io.github.bmaltais.startdrive
DEVKIT_NAME=startdrive
DEVKIT_LAYERS=(omarchy-startdrive)

# The session must never reach your real drives: its shell shares your user's systemd, keyring and rclone config, so a click on a
# mount switch would mount (or a "forget" would remove) a real account. So everything in the session runs in demo mode: the CLI
# serves fixture drives and runs no systemd, rclone, keyring or file-manager command at all (lib/demo.sh). Nothing of the real
# config is copied in, and the session refuses to start unless the sandbox's marker is there.
DEVKIT_ENV=(STARTDRIVE_DEMO=1)
TOUR_SANDBOX_COPY=()
TOUR_SANDBOX_LINK=(.local/share/icons)
# A recording proves it touched none of these. Never name ~/Cloud or anything else a mount lives under: it is walked, which is slow and
# spends the drive's API quota.
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startdrive .config/systemd/user .config/rclone .local/share/applications/startdrive.desktop .local/bin/startdrive)

devkit_sandbox() {
  local h=$1
  mkdir -p "$h/.config/startdrive/demo"
  : >"$h/.config/startdrive/demo/ENABLED"
  [[ -f $h/.config/startdrive/demo/ENABLED ]] || { echo "nested: could not switch the sandbox to demo mode" >&2; return 1; }
  # The first-run offer has been answered, so no window opens by itself over what is being filmed or tested.
  printf 'SETUP_DONE=1\n' >"$h/.config/startdrive/config"
  # A real drive's settings or state in the sandbox would mean something was copied that should not have been.
  if compgen -G "$h/.config/startdrive/*.env" >/dev/null; then
    echo "nested: the sandbox holds a real drive's settings; list nothing of .config/startdrive in TOUR_SANDBOX_COPY" >&2
    return 1
  fi
}

DEVKIT_USAGE='  dev open | setup | settings DRIVE_ID | close      open or close a window of the plugin there'
dev_cmd_open() { nenv omarchy-shell -q "$ID" close 2>/dev/null || true; sleep 0.4; dev_window open "$ID" open; }
dev_cmd_setup() { dev_window setup "$ID" setup; }
dev_cmd_settings() { dev_window settings "$ID" settings "${1:?settings needs a drive id}"; }
dev_cmd_close() { nenv omarchy-shell "$ID" close >/dev/null; echo "dev close: closed"; }
