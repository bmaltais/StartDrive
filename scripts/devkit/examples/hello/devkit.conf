# shellcheck shell=bash
# The example plugin's settings for the devkit (docs/configuration.md): its id, that it has no bar widget, and the layer of its window.
TOUR_PLUGIN_ID=io.example.hello
TOUR_PLUGIN_WIDGET=0
DEVKIT_NAME=hello
DEVKIT_LAYERS=(omarchy-hello)
TOUR_TITLE=Hello
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json)

DEVKIT_USAGE='  dev open | close            show or hide the card there'
dev_cmd_open() { dev_window open io.example.hello open; }
dev_cmd_close() { nenv omarchy-shell -q io.example.hello close; echo "dev close: closed"; }
